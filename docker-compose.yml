services:
  app:
    build:
      context: .
      args:
        # ビルド時 (npm install / pip install) にホストのプロキシ設定を引き継ぐ
        - HTTP_PROXY
        - HTTPS_PROXY
        - NO_PROXY
        - http_proxy
        - https_proxy
        - no_proxy
    restart: unless-stopped
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-auto}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-auto}
      JOB_WORKERS: ${JOB_WORKERS:-1}
      MAX_REALTIME_SESSIONS: ${MAX_REALTIME_SESSIONS:-2}
      REALTIME_PARTIAL_INTERVAL: ${REALTIME_PARTIAL_INTERVAL:-2.0}
      DIARIZATION: ${DIARIZATION:-1}
      SPEAKER_THRESHOLD: ${SPEAKER_THRESHOLD:-0.4}
      # ローカル LLM 連携(要約・議事録)。未設定なら機能ごと無効。
      # ホスト側の Ollama を使う場合: http://host.docker.internal:11434/v1
      LLM_API_URL: ${LLM_API_URL:-}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b-instruct}
      LLM_API_KEY: ${LLM_API_KEY:-}
      # 実行時 (Hugging Face からのモデルダウンロード) 用プロキシ。
      # huggingface_hub が標準でこれらの環境変数を参照する
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      http_proxy: ${http_proxy:-${HTTP_PROXY:-}}
      https_proxy: ${https_proxy:-${HTTPS_PROXY:-}}
      no_proxy: ${no_proxy:-${NO_PROXY:-}}
    volumes:
      - app_data:/data
      - model_cache:/root/.cache/huggingface
    # コンテナからホストの LLM サーバー (Ollama 等) に host.docker.internal で届くように
    # (Docker Desktop では標準、Linux の Docker Engine ではこの指定が必要)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # ローカル開発用: http://localhost:8000 で直接アクセスできる
    ports:
      - "127.0.0.1:8000:8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      # 社内公開時はここをサーバーのホスト名に変える (例: transcribe.example.internal)
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  app_data:
  model_cache:
  caddy_data:
  caddy_config:
